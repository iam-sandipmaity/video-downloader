org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# Temporary AGP 9 compatibility bridge while the project still uses kapt and
# legacy Android DSL/source-set wiring. These flags will need a follow-up
# cleanup before AGP 10.
android.builtInKotlin=false
android.newDsl=false
android.sourceset.disallowProvider=false
kotlin.code.style=official
kotlin.incremental=true

# ── App version ────────────────────────────────────────────────────────────────
# Bump these manually before tagging a release.
# versionCode must be a positive integer, incremented with every release.
# versionName is shown in the APK filename: video-downloader-v<versionName>.apk
APP_VERSION_CODE=16
APP_VERSION_NAME=1.7.0.1-beta
