org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true

# ---- Stable app version ---------------------------------------------------
# Bump these manually before tagging a stable release.
# versionCode must be a positive integer, incremented with every stable release.
# versionName is shown in the stable APK filename: video-downloader-v<versionName>.apk
APP_VERSION_CODE=33
APP_VERSION_NAME=1.7.5.0

# ---- Nightly app version --------------------------------------------------
# Bump these for nightly builds. Nightly versionCode must increase for Android
# to install a newer nightly over the previous nightly package.
# versionName is shown in the nightly APK filename: nightly-<versionName>.apk
NIGHTLY_VERSION_CODE=42
NIGHTLY_VERSION_NAME=2.0.1.8
