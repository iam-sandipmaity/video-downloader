name: Set up Android SDK
description: Use the GitHub-hosted Android SDK and install only the build packages this project needs.

runs:
  using: composite
  steps:
    - name: Configure Android SDK
      shell: bash
      run: |
        set -euo pipefail

        ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
        echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
        echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
        echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
        echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"

        SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
        if [[ ! -x "${SDKMANAGER}" ]]; then
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
        fi
        if [[ -z "${SDKMANAGER}" || ! -x "${SDKMANAGER}" ]]; then
          echo "Unable to find sdkmanager under ${ANDROID_HOME}" >&2
          exit 1
        fi
        echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"

        set +o pipefail
        yes | "${SDKMANAGER}" --licenses >/dev/null || true
        set -o pipefail

        packages=(
          "platform-tools"
          "platforms;android-36"
        )

        for attempt in 1 2 3; do
          if "${SDKMANAGER}" --install "${packages[@]}"; then
            exit 0
          fi

          echo "sdkmanager install failed on attempt ${attempt}; clearing temporary SDK downloads before retry."
          rm -rf "${ANDROID_HOME}/.temp" "${ANDROID_HOME}/temp"
          sleep "$((attempt * 15))"
        done

        echo "Android SDK package installation failed after retries." >&2
        exit 1
