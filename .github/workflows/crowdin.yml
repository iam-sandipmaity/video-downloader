name: Crowdin

on:
  workflow_call:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Sync translations
        uses: crowdin/github-action@v2.12.0
        with:
          source: app/src/main/res/values/strings.xml
          translation: app/src/main/res/values-%android_code%/%original_file_name%
          base_path: .
          base_url: https://api.crowdin.com
          upload_sources: true
          upload_sources_args: --label android --label app-ui
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          skip_ref_checkout: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: Crowdin translation updates
          pull_request_body: |
            Updates Android string resources from Crowdin.
          pull_request_base_branch_name: main
          commit_message: Update translations from Crowdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
