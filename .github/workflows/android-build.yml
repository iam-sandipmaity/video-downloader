name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      nightly_version_name: ${{ steps.version.outputs.nightly_version_name }}
      nightly_version_code: ${{ steps.version.outputs.nightly_version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: ./.github/actions/setup-android-sdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Read version from gradle.properties
        id: version
        run: |
          APP_VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          APP_VERSION_CODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d'=' -f2)
          NIGHTLY_VERSION=$(grep '^NIGHTLY_VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          NIGHTLY_VERSION_CODE=$(grep '^NIGHTLY_VERSION_CODE=' gradle.properties | cut -d'=' -f2)
          echo "version_name=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${APP_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "nightly_version_name=${NIGHTLY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "nightly_version_code=${NIGHTLY_VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Verify wrapper
        run: ./gradlew --version

      - name: Compile standard debug and run unit tests
        run: ./gradlew :app:compileStandardDebugKotlin :app:testStandardDebugUnitTest

      - name: Run standard debug lint
        id: lint
        run: |
          set +e
          ./gradlew :app:lintAnalyzeStandardDebug :app:lintReportStandardDebug
          lint_exit=$?
          echo "exit_code=${lint_exit}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report standard debug lint status
        if: always() && steps.lint.outputs.exit_code != '0'
        run: echo "::warning::Standard debug lint reported issues. See the uploaded lint artifact for details."

      - name: Upload standard debug lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-standard-debug-${{ steps.version.outputs.version_name }}
          path: |
            app/build/reports/lint-results-standardDebug.html
            app/build/intermediates/lint_intermediate_text_report/standardDebug/lintReportStandardDebug/lint-results-standardDebug.txt
          if-no-files-found: warn

      - name: Prepare signing files
        shell: bash
        env:
          INTERNAL_DEBUG_KEYSTORE_BASE64: ${{ secrets.INTERNAL_DEBUG_KEYSTORE_BASE64 }}
          INTERNAL_DEBUG_STORE_PASSWORD: ${{ secrets.INTERNAL_DEBUG_STORE_PASSWORD }}
          INTERNAL_DEBUG_KEY_ALIAS: ${{ secrets.INTERNAL_DEBUG_KEY_ALIAS }}
          INTERNAL_DEBUG_KEY_PASSWORD: ${{ secrets.INTERNAL_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$INTERNAL_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$INTERNAL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/internal-debug.jks"
            echo "INTERNAL_DEBUG_STORE_FILE=$RUNNER_TEMP/internal-debug.jks" >> "$GITHUB_ENV"
            echo "INTERNAL_DEBUG_STORE_PASSWORD=$INTERNAL_DEBUG_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTERNAL_DEBUG_KEY_ALIAS=$INTERNAL_DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTERNAL_DEBUG_KEY_PASSWORD=$INTERNAL_DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Verify packaged ffmpeg binary exists (blocking)
        run: |
          required_ffmpeg="app/src/main/jniLibs/arm64-v8a/libffmpeg_exec.so"

          if [ ! -f "$required_ffmpeg" ]; then
            echo "::error::Missing required packaged ffmpeg binary."
            echo "Required files:"
            echo "  $required_ffmpeg"
            echo "Detected files under app/src/main/jniLibs:"
            find app/src/main/jniLibs -type f 2>/dev/null || true
            exit 1
          fi

      - name: Build nightly APK
        run: ./gradlew -PAPP_RELEASE_CHANNEL=nightly :app:assembleStandardNightly

      - name: Rename nightly APK
        run: |
          VERSION="${{ steps.version.outputs.nightly_version_name }}"
          APK_DIR="app/build/outputs/apk/standard/nightly"
          APK_SOURCE=$(find "$APK_DIR" -maxdepth 1 -name 'app-standard-nightly*.apk' | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::Could not find the standard nightly APK in $APK_DIR"
            find "$APK_DIR" -maxdepth 1 -type f || true
            exit 1
          fi
          mv "$APK_SOURCE" "$APK_DIR/nightly-${VERSION}.apk"

      - name: Create stable nightly.link APK filename
        run: |
          VERSION="${{ steps.version.outputs.nightly_version_name }}"
          APK_DIR="app/build/outputs/apk/standard/nightly"
          cp "$APK_DIR/nightly-${VERSION}.apk" "$APK_DIR/nightly-debug.apk"

      - name: Upload nightly APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ steps.version.outputs.nightly_version_name }}
          path: app/build/outputs/apk/standard/nightly/nightly-${{ steps.version.outputs.nightly_version_name }}.apk

      - name: Upload latest nightly.link APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: app/build/outputs/apk/standard/nightly/nightly-debug.apk
          archive: false
