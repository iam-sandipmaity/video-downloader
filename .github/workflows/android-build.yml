name: Android Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-version: "9.4.1"

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare signing files
        shell: bash
        env:
          INTERNAL_DEBUG_KEYSTORE_BASE64: ${{ secrets.INTERNAL_DEBUG_KEYSTORE_BASE64 }}
          INTERNAL_DEBUG_STORE_PASSWORD: ${{ secrets.INTERNAL_DEBUG_STORE_PASSWORD }}
          INTERNAL_DEBUG_KEY_ALIAS: ${{ secrets.INTERNAL_DEBUG_KEY_ALIAS }}
          INTERNAL_DEBUG_KEY_PASSWORD: ${{ secrets.INTERNAL_DEBUG_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$INTERNAL_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$INTERNAL_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/internal-debug.jks"
            echo "INTERNAL_DEBUG_STORE_FILE=$RUNNER_TEMP/internal-debug.jks" >> "$GITHUB_ENV"
            echo "INTERNAL_DEBUG_STORE_PASSWORD=$INTERNAL_DEBUG_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INTERNAL_DEBUG_KEY_ALIAS=$INTERNAL_DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INTERNAL_DEBUG_KEY_PASSWORD=$INTERNAL_DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Verify packaged ffmpeg binary exists (blocking)
        run: |
          required_ffmpeg="app/src/main/jniLibs/arm64-v8a/libffmpeg_exec.so"

          if [ ! -f "$required_ffmpeg" ]; then
            echo "::error::Missing required packaged ffmpeg binary."
            echo "Required files:"
            echo "  $required_ffmpeg"
            echo "Detected files under app/src/main/jniLibs:"
            find app/src/main/jniLibs -type f 2>/dev/null || true
            exit 1
          fi

      - name: Build nightly debug APK
        run: gradle :app:assembleDebug

      - name: Rename nightly debug APK
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/video-downloader-v${VERSION}-nightly-debug.apk

      - name: Upload nightly debug APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: video-downloader-v${{ steps.version.outputs.version_name }}-nightly-debug
          path: app/build/outputs/apk/debug/video-downloader-*.apk

  release-nightly:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download nightly debug APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: video-downloader-v${{ needs.build.outputs.version_name }}-nightly-debug
          path: dist

      - name: Create nightly GitHub prerelease
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "Nightly Build #${{ github.run_number }} (v${{ needs.build.outputs.version_name }})"
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/*.apk

  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-version: "9.4.1"

      - name: Read version from gradle.properties
        id: version
        run: |
          VERSION=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d'=' -f2)
          echo "version_name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing files
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing release signing secrets. Tagged releases must use the stable release keystore."
            exit 1
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease

      - name: Rename release APK
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/video-downloader-v${VERSION}.apk 2>/dev/null || \
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/video-downloader-v${VERSION}.apk 2>/dev/null || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          name: "Video Downloader v${{ steps.version.outputs.version_name }}"
          generate_release_notes: true
          files: app/build/outputs/apk/release/video-downloader-*.apk
