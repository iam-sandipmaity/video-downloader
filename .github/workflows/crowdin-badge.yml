name: Crowdin Badge

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main

      - name: Generate Crowdin progress assets
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -z "${CROWDIN_PROJECT_ID}" ] || [ -z "${CROWDIN_PERSONAL_TOKEN}" ]; then
            echo "Crowdin secrets are not configured; leaving progress assets unchanged."
            exit 0
          fi

          python3 .github/scripts/update_crowdin_progress.py

      - name: Commit Crowdin progress updates
        run: |
          if git diff --quiet -- README.md .github/badges/crowdin.json .github/badges/crowdin-progress.svg; then
            echo "Crowdin progress assets are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/badges/crowdin.json .github/badges/crowdin-progress.svg
          git commit -m "Update Crowdin translation progress"
          git push
